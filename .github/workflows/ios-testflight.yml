# Martec Buddy iOS TestFlight. A push to main builds the Capacitor app,
# signs it with the shared Solo Dreams distribution certificate, and uploads it.

name: iOS TestFlight

permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  BUNDLE_ID: com.solodreams.MartecBuddy
  APPLE_APP_ID: "6820046436"

jobs:
  upload-testflight:
    name: Sign IPA and upload TestFlight
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and sync iOS
        run: |
          npm ci
          npx cap sync ios

      - name: Select Xcode 26
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            echo "Xcode 26 not found. Installed Xcode apps:"
            ls /Applications | grep Xcode || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_P12_PASSWORD }}
          keychain: build

      - name: Install provisioning profile
        env:
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          PROFILE_PATH=$RUNNER_TEMP/MartecBuddy.mobileprovision
          printf '%s' "$IOS_MOBILEPROVISION_BASE64" | base64 --decode > "$PROFILE_PATH"
          PROFILE_PLIST=$(security cms -D -i "$PROFILE_PATH")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< "$PROFILE_PLIST")
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /dev/stdin <<< "$PROFILE_PLIST")
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Profile $PROFILE_NAME ($PROFILE_UUID) for $APP_ID"
          case "$APP_ID" in
            *."$BUNDLE_ID") ;;
            *) echo "Provisioning profile is not for $BUNDLE_ID"; exit 1 ;;
          esac
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision

      - name: Install CocoaPods
        working-directory: ios/App
        run: pod install

      - name: Set build number and manual signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 - <<'PY'
          import os, re
          path = "ios/App/App.xcodeproj/project.pbxproj"
          text = open(path, encoding="utf-8").read()
          run = os.environ["GITHUB_RUN_NUMBER"]
          team = os.environ["APPLE_TEAM_ID"]
          bundle = os.environ["BUNDLE_ID"]
          text, count = re.subn(r"CURRENT_PROJECT_VERSION = \d+;", f"CURRENT_PROJECT_VERSION = {run};", text)
          if count < 1:
              raise SystemExit("Build number was not patched")
          text = text.replace("PRODUCT_BUNDLE_IDENTIFIER = dk.martec.buddy;", f"PRODUCT_BUNDLE_IDENTIFIER = {bundle};")
          if f"PRODUCT_BUNDLE_IDENTIFIER = {bundle};" not in text:
              raise SystemExit("Bundle id is missing from the Xcode project")
          def patch(match):
              block = match.group(0)
              if f"PRODUCT_BUNDLE_IDENTIFIER = {bundle};" not in block:
                  return block
              block = block.replace("CODE_SIGN_STYLE = Automatic;", "CODE_SIGN_STYLE = Manual;")
              if "DEVELOPMENT_TEAM" not in block:
                  block = block.replace("buildSettings = {\n", f"buildSettings = {{\n\t\t\t\tDEVELOPMENT_TEAM = {team};\n", 1)
              else:
                  block = re.sub(r"DEVELOPMENT_TEAM = [^;]+;", f"DEVELOPMENT_TEAM = {team};", block)
              return block
          patched = re.sub(r"buildSettings = \{.*?\n\t\t\t\};", patch, text, flags=re.DOTALL)
          open(path, "w", encoding="utf-8").write(patched)
          print(f"Set build number to {run}")
          PY

      - name: Build signed IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ env.PROFILE_NAME }}
          PROFILE_UUID: ${{ env.PROFILE_UUID }}
        run: |
          EXPORT_PLIST=$RUNNER_TEMP/ExportOptions.plist
          python3 - <<'PY'
          import os, plistlib
          path = os.path.join(os.environ["RUNNER_TEMP"], "ExportOptions.plist")
          payload = {
              "method": "app-store-connect",
              "teamID": os.environ["APPLE_TEAM_ID"],
              "signingStyle": "manual",
              "provisioningProfiles": {os.environ["BUNDLE_ID"]: os.environ["PROFILE_NAME"]},
              "uploadSymbols": True,
          }
          with open(path, "wb") as handle:
              plistlib.dump(payload, handle)
          PY
          security find-identity -v -p codesigning
          cd ios/App
          ARCHIVE_LOG=$RUNNER_TEMP/xcodebuild-archive.log
          set +e
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MartecBuddy.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution: EMIL VON LILLIENSKJOLD JENSEN (85J2T34X8N)" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive 2>&1 | tee "$ARCHIVE_LOG"
          ARCHIVE_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$ARCHIVE_STATUS" -ne 0 ]; then
            echo "xcodebuild archive failed with exit code $ARCHIVE_STATUS"
            grep -E "error:|fatal error:|ARCHIVE FAILED|Code Sign error|Provisioning profile" "$ARCHIVE_LOG" | tail -40 || true
            exit "$ARCHIVE_STATUS"
          fi
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MartecBuddy.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$EXPORT_PLIST"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        env:
          APPLE_CONNECT_KEY: ${{ secrets.APPLE_CONNECT_KEY }}
          APPLE_CONNECT_KEY_ID: ${{ secrets.APPLE_CONNECT_KEY_ID }}
          APPLE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_CONNECT_ISSUER_ID }}
          DEVELOPER_DIR: ${{ env.DEVELOPER_DIR }}
        run: |
          KEY_PATH=$RUNNER_TEMP/AuthKey.p8
          printf '%s' "$APPLE_CONNECT_KEY" | base64 --decode > "$KEY_PATH"
          python3 - <<'PY'
          import json, os
          key_path = os.path.join(os.environ["RUNNER_TEMP"], "AuthKey.p8")
          with open(key_path, encoding="utf-8") as handle:
              key = handle.read().strip()
          payload = {
              "key_id": os.environ["APPLE_CONNECT_KEY_ID"].strip(),
              "issuer_id": os.environ["APPLE_CONNECT_ISSUER_ID"].strip(),
              "key": key,
              "duration": 1200,
              "in_house": False,
          }
          out = os.path.join(os.environ["RUNNER_TEMP"], "api_key.json")
          with open(out, "w", encoding="utf-8") as handle:
              json.dump(payload, handle)
          PY
          IPA_PATH=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA found"
            exit 1
          fi
          gem install fastlane --no-document
          fastlane pilot upload \
            --api_key_path "$RUNNER_TEMP/api_key.json" \
            --ipa "$IPA_PATH" \
            --app_identifier "$BUNDLE_ID" \
            --apple_id "$APPLE_APP_ID" \
            --uses_non_exempt_encryption false \
            --skip_waiting_for_build_processing true
